services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barbersaas
      POSTGRES_USER: barbersaas
      POSTGRES_PASSWORD: barbersaas_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbersaas -d barbersaas"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      APP_ENV: development
      APP_SECRET: desenvolvimento-troque-em-producao
      APP_BASE_URL: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1
      CREATE_DEMO_ADMIN: "1"
      DATABASE_URL: postgresql://barbersaas:barbersaas_local@db:5432/barbersaas
      ASAAS_SANDBOX: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
