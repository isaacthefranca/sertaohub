{% extends "base.html" %}{% block title %}Configurações{% endblock %}{% block content %}<div class="pagehead"><div><h1>Configurações</h1><p>WhatsApp, lembretes, avaliações e políticas.</p></div></div><section class="panel"><form method="post" class="formstack"><label>WhatsApp<input name="whatsapp_number" value="{{st.whatsapp_number if st else ''}}" placeholder="5583999999999"></label><label>Lembrete antes do horário (horas)<input name="reminder_hours" type="number" value="{{st.reminder_hours if st else 24}}"></label><label>Link de avaliação Google<input name="google_review_url" value="{{st.google_review_url if st else ''}}"></label><label>Política de cancelamento<textarea name="cancellation_policy">{{st.cancellation_policy if st else ''}}</textarea></label><button>Salvar configurações</button></form><p class="muted">Integração automática de WhatsApp requer WhatsApp Cloud API e credenciais próprias. O sistema não usa automações não oficiais.</p></section>{% endblock %}
