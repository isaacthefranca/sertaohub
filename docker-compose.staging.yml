services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barbersaas_staging
      POSTGRES_USER: barbersaas
      POSTGRES_PASSWORD: staging_local_change_me
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbersaas -d barbersaas_staging"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    environment:
      APP_ENV: staging
      APP_SECRET: staging-secret-change-this-to-at-least-32-characters
      APP_BASE_URL: http://localhost:8001
      ALLOWED_HOSTS: localhost,127.0.0.1
      CREATE_DEMO_ADMIN: "0"
      DATABASE_URL: postgresql://barbersaas:staging_local_change_me@db:5432/barbersaas_staging
      ASAAS_SANDBOX: "1"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  staging_pgdata:
